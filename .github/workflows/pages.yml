name: Pages

# The site is one file in `docs/` and nothing is built for it: no generator, no
# theme, no node_modules. That is the whole deployment story, which is why it
# fits in twenty lines.
on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: configure
        uses: actions/configure-pages@v6

      - name: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: deploy
        id: deploy
        uses: actions/deploy-pages@v5
