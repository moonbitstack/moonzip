name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      # The optimising build is not the same program: it inlines, it removes the
      # reads it can prove are dead, and it is the one the throughput table and
      # every published number come from. A test that only passes unoptimised is a
      # test that passes in the wrong build.
      - name: moon test (release)
        run: moon test --target all --release

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code
  examples:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: the examples run
        run: |
          moon update
          for dir in src/examples/*/; do
            moon run "$dir" --target native > /dev/null
          done

      - name: docs/api.html is generated and up to date
        run: |
          moon update
          moon info
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      # A hand-written page has no compiler, and the things that break in one are
      # the things a browser forgives: an anchor that no longer exists, a link to a
      # file that was renamed, a section left open. Failing here is cheaper than
      # finding out from a reader.
      - name: the documentation pages hold together
        run: python3 scripts/check_docs.py
